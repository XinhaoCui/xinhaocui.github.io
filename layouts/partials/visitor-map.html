{{- if fileExists "static/visitor-map/visits.json" }}
  <figure class="visitor-map" id="visitor-map" aria-labelledby="visitor-map-title">
    <header class="visitor-map-heading">
      <div><h2 id="visitor-map-title">Visitor map</h2><p>Visits by country or region · Cloudflare Web Analytics</p></div>
      <p class="visitor-total" id="visitor-total" role="status">Loading visit totals…</p>
    </header>
    <div class="visitor-atlas" id="visitor-atlas" data-world="{{ "visitor-map/world.json" | relURL }}" data-visits="{{ "visitor-map/visits.json" | relURL }}">
      <svg viewBox="0 0 1000 470" role="group" aria-label="World map showing country-level visit totals"></svg>
      <div class="visitor-controls" aria-label="Map zoom">
        <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
        <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
        <button type="button" data-zoom="reset" aria-label="Reset map">↺</button>
      </div>
      <p id="visitor-selection" role="status" hidden></p>
    </div>
    <figcaption><span id="visitor-period">Country-level totals only; markers do not indicate cities or individual visitors.</span><a href="https://developers.cloudflare.com/web-analytics/data-metrics/dimensions/" target="_blank" rel="noopener noreferrer">About the data</a></figcaption>
    <ul class="visitor-breakdown" id="visitor-breakdown" aria-label="Visits by country or region" hidden></ul>
    <noscript><p>Enable JavaScript to view the interactive visitor map.</p></noscript>
  </figure>
  {{- $script := resources.Get "js/visitor-atlas.js" | minify | fingerprint -}}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
{{- else }}
  {{- partial "visitor-map-legacy.html" . }}
{{- end }}
