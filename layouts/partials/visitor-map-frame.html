<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="origin">
  <meta name="robots" content="noindex">
  <title>Visitor map</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://mapmyvisitors.com https://code.jquery.com; style-src 'unsafe-inline'; img-src data: https://mapmyvisitors.com https://dev.mapmyvisitors.com; connect-src https://mapmyvisitors.com; base-uri https://xinhaocui.github.io; form-action 'none'">
  <base href="https://xinhaocui.github.io/">
  <style>
    html,body,#map-host{margin:0;width:100%;height:100%;overflow:hidden}
    body{font:14px/1.35 system-ui,sans-serif;background:#edf4f6;color:#244550}
    #mapmyvisitors-widget,#mapmyvisitors-widget .mapmyvisitors-map-container,#mapmyvisitors-widget .mapmyvisitors-map{width:100%!important;height:100%!important}
    #mapmyvisitors-widget{cursor:default!important}
    #mapmyvisitors-widget .mpmvs,#clstminf,.mapmyvisitors-loading{display:none!important}
    #map-tools{position:absolute;right:10px;top:10px;z-index:3;display:grid;gap:6px}
    #map-tools[hidden],#fallback[hidden],#loading[hidden],#map-points[hidden]{display:none}
    #map-tools button{width:40px;height:40px;border:1px solid #a9bfc5;border-radius:9px;background:#fff;color:#254650;font:600 21px/1 system-ui;cursor:pointer}
    #map-tools button:focus-visible{outline:2px solid #176b86;outline-offset:2px}
    #map-tools button:hover{background:#e2edf0}
    .jvectormap-zoomin,.jvectormap-zoomout{display:none!important}
    .map-boundaries{fill:#bfd0d4;stroke:#f5fafb;stroke-width:.7;pointer-events:none}
    .map-boundaries path{vector-effect:non-scaling-stroke}
    .jvectormap-marker[data-located="true"]:not([display="none"]){visibility:visible!important}
    .jvectormap-marker:not([data-located="true"]){visibility:hidden!important;pointer-events:none}
    .jvectormap-marker{r:8px;fill:#b23438;fill-opacity:1;stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 0 3px #701821a0);cursor:pointer;pointer-events:all}
    .jvectormap-marker:is(:hover,:focus-visible,[aria-pressed="true"]){r:11px;fill:#8b2028;stroke-width:3;outline:none}
    #mapmyvisitors-widget .jvectormap-container,#mapmyvisitors-widget .mapmyvisitors-map{background-color:#edf4f6!important;background-image:none!important}
    .jvectormap-tip{font:13px/1.35 system-ui!important;color:#fff!important;background:#23434e!important;border:0!important;padding:6px 9px!important;border-radius:6px!important}
    #loading{position:absolute;z-index:2;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:600}
    #fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
    #map-points{position:absolute;bottom:9px;left:9px;right:9px;z-index:2;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;pointer-events:none}
    #map-points span{background:#fff;color:#254650;border:1px solid #a9bfc5;border-radius:6px;padding:4px 8px;font-size:12px}
    #point-detail:empty{display:none}
    @media(max-width:480px){#map-tools{right:6px;top:6px}#map-tools button{width:34px;height:34px}#map-points{left:5px;right:5px;bottom:5px}}
  </style>
</head>
<body>
  <div id="map-host">
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
    <script>
      if (window.jQuery) {
        window.vmap_jq = window.jQuery.noConflict(true);
        window.vmap_jq.ajaxPrefilter(options => {
          options.url = options.url.replace(/^http:\/\/mapmyvisitors\.com(?=\/)/, 'https://mapmyvisitors.com');
        });
      }
      // The provider's widget ships markers but omits the world paths.
      // Capture the provider's matching geometry without replacing its map plugin.
      window.jQuery = {fn:{vectorMap(command, name, geometry) {
        if (command === 'addMap' && name === 'world_mill_en' && geometry.width === 900) {
          window.dispatchEvent(new CustomEvent('world-geometry', {detail: geometry.paths}));
        }
      }}};
    </script>
    <script id="mapmyvisitors" src="{{ .widget }}" defer></script>
    <script src="https://mapmyvisitors.com/assets/maps/jvectormap/jquery-jvectormap-world-mill-en.js" defer></script>
  </div>
  <div id="loading" role="status">Loading visitor locations…</div>
  <img id="fallback" data-image="{{ .fallback }}" alt="Map of approximate visitor locations" hidden>
  <div id="map-points" hidden>
    <span id="point-count"></span><span id="point-detail" role="status"></span>
  </div>
  <div id="map-tools" hidden>
    <button type="button" id="map-in" aria-label="Zoom in" title="Zoom in">+</button>
    <button type="button" id="map-out" aria-label="Zoom out" title="Zoom out">−</button>
    <button type="button" id="map-reset" aria-label="Reset map view" title="Reset view">↺</button>
  </div>
  <script>
    (() => {
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      const tools = document.getElementById('map-tools');
      const host = document.getElementById('map-host');
      const points = document.getElementById('map-points');
      const pointCount = document.getElementById('point-count');
      const pointDetail = document.getElementById('point-detail');
      let map;
      let paths;
      let ready = false;
      let hadPoints = false;
      let pointWait;
      function pointLocation(marker) {
        const label = map?.markers?.[marker.getAttribute('data-index')]?.config?.name;
        if (typeof label !== 'string') return null;
        const place = label.trim().replace(/^\d[\d,]*\s+(?:recent\s+)?visits?\s+from\s+/i, '').trim();
        if (/^(?:unknown(?: location)?|unavailable|n\/a|not available)$/i.test(place)) return null;
        // Accept place names only, not IPs, IDs or provider-supplied markup.
        return /^[\p{L}\p{M}][\p{L}\p{M} .,'’()\-]{0,79}$/u.test(place) ? place : null;
      }
      function updatePoints() {
        if (!ready) return;
        const markers = [...host.querySelectorAll('circle.jvectormap-marker')].filter(marker =>
          marker.hasAttribute('cx') && marker.hasAttribute('cy') && getComputedStyle(marker).display !== 'none');
        if (!markers.length && !hadPoints) return;
        hadPoints = true;
        clearTimeout(pointWait);
        const located = markers.filter(marker => pointLocation(marker));
        const label = located.length === 0 ? 'No geolocated visits to display'
          : located.length + (located.length === 1 ? ' location shown' : ' locations shown');
        if (pointCount.textContent !== label) pointCount.textContent = label;
        if (!host.querySelector('.jvectormap-marker[aria-pressed="true"]')) {
          pointDetail.textContent = located.length === markers.length ? ''
            : 'Visits without a known location are not plotted.';
        }
        for (const marker of markers) {
          const place = pointLocation(marker);
          if (!place) {
            marker.removeAttribute('data-located');
            marker.removeAttribute('tabindex');
            marker.removeAttribute('role');
            marker.removeAttribute('aria-label');
            marker.removeAttribute('aria-pressed');
            marker.setAttribute('aria-hidden','true');
            continue;
          }
          marker.removeAttribute('aria-hidden');
          marker.setAttribute('data-located','true');
          marker.setAttribute('tabindex', '0');
          marker.setAttribute('role', 'button');
          marker.setAttribute('aria-label', place);
          if (!marker.hasAttribute('aria-pressed')) marker.setAttribute('aria-pressed', 'false');
        }
      }
      function selectPoint(marker) {
        const place = pointLocation(marker);
        if (!place) return;
        const old = host.querySelector('.jvectormap-marker[aria-pressed="true"]');
        if (old) old.setAttribute('aria-pressed','false');
        marker.setAttribute('aria-pressed','true');
        pointDetail.textContent = place;
      }
      function drawBoundaries() {
        const root = map?.canvas?.rootElement?.node;
        if (!root || !paths || root.querySelector('.map-boundaries')) return false;
        const ns = 'http://www.w3.org/2000/svg';
        const group = document.createElementNS(ns, 'g');
        group.setAttribute('class', 'map-boundaries');
        group.setAttribute('aria-hidden', 'true');
        for (const entry of Object.values(paths)) {
          if (typeof entry.path !== 'string') continue;
          const path = document.createElementNS(ns, 'path');
          path.setAttribute('d', entry.path);
          group.appendChild(path);
        }
        if (group.childElementCount < 100) return false;
        root.prepend(group);
        return true;
      }
      const isReady = () => {
        if (ready) { updatePoints(); return; }
        const container = host.querySelector('.jvectormap-container');
        const jq = window.vmap_jq;
        map = container && jq && jq(container).data('mapObject');
        if (!drawBoundaries()) return;
        ready = true;
        if (map) {
          map.params.panOnDrag = true;
          map.params.zoomOnScroll = false;
        }
        loading.hidden = true;
        fallback.hidden = true;
        tools.hidden = !map;
        points.hidden = false;
        pointCount.textContent = 'Loading locations…';
        pointWait = setTimeout(() => { pointCount.textContent = 'No locations loaded'; }, 8000);
        updatePoints();
        clearTimeout(timer);
      };
      window.addEventListener('world-geometry', event => { paths = event.detail; isReady(); });
      new MutationObserver(isReady).observe(host, { childList: true, subtree: true, attributes: true, attributeFilter: ['cx', 'cy', 'display'] });
      const timer = setTimeout(() => {
        if (ready) return;
        fallback.addEventListener('load', () => {
          if (!ready) {
            fallback.hidden = false;
            points.hidden = false;
            pointCount.textContent = 'Static map · interactive locations unavailable';
          }
          loading.hidden = true;
        });
        fallback.addEventListener('error', () => { loading.textContent = 'Visitor map is temporarily unavailable.'; });
        fallback.src = fallback.dataset.image;
      }, 6500);
      host.addEventListener('click', event => {
        const marker = event.target.closest('.jvectormap-marker');
        if (marker) selectPoint(marker);
        if (event.target.closest('#mapmyvisitors-widget')) event.preventDefault();
      }, true);
      host.addEventListener('keydown', event => {
        if (!['Enter',' '].includes(event.key) || !event.target.matches('.jvectormap-marker')) return;
        event.preventDefault();
        selectPoint(event.target);
      });
      host.addEventListener('wheel', event => event.stopPropagation(), {capture: true, passive: true});
      const zoom = factor => map && map.setScale(map.scale * factor, map.width / 2, map.height / 2);
      document.getElementById('map-in').onclick = () => zoom(1.45);
      document.getElementById('map-out').onclick = () => zoom(1 / 1.45);
      document.getElementById('map-reset').onclick = () => {
        if (map) map.setScale(map.baseScale, map.width / 2, map.height / 2);
      };
    })();
  </script>
</body>
</html>
